<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Clock 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Bebas Neue', sans-serif;
        }

        .countdown-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .goal-title {
            color: #3E2723;
            font-size: 1.5rem; 
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: center;
        }

        .clock-display {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .flip-card {
            background-color: #F2E6D8;
            color: #3E2723;
            width: 90px;
            height: 110px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4.5rem;
            position: relative;
            box-shadow: 0 4px 10px rgba(62, 39, 35, 0.15); 
            overflow: hidden;
        }

        .flip-card::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(62, 39, 35, 0.1);
            transform: translateY(-50%);
        }

        .separator {
            font-size: 3.5rem;
            color: #3E2723;
            margin-top: -10px;
        }

        .label-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
            justify-content: center;
        }

        .label {
            width: 90px;
            text-align: center;
            color: #3E2723;
            font-size: 0.9rem;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        #message {
            color: #3E2723;
            margin-top: 20px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <div class="goal-title">END OF SEMESTER</div>

        <div class="clock-display">
            <div class="flip-card"><span id="days">00</span></div>
            <div class="separator">:</div>
            <div class="flip-card"><span id="hours">00</span></div>
            <div class="separator">:</div>
            <div class="flip-card"><span id="minutes">00</span></div>
            <div class="separator">:</div>
            <div class="flip-card"><span id="seconds">00</span></div>
        </div>

        <div class="label-container">
            <div class="label">DIAS</div>
            <div class="separator" style="opacity: 0; width: 5px;"></div>
            <div class="label">HORAS</div>
            <div class="separator" style="opacity: 0; width: 5px;"></div>
            <div class="label">MINS</div>
            <div class="separator" style="opacity: 0; width: 5px;"></div>
            <div class="label">SEGS</div>
        </div>

        <div id="message"></div>
    </div>

    <script>
        // --- CONFIGURAÇÃO DA DATA: 1 JAN 2026 ---
        const targetDate = new Date(2026, 4, 29, 0, 0, 0).getTime();

        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const msgEl = document.getElementById('message');

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                // Se a data já passou
                clearInterval(interval);
                msgEl.innerText = "FELIZ ANIVERSÁRIO AMOR!";
                return; 
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.innerText = days < 10 ? '0' + days : days;
            hoursEl.innerText = hours < 10 ? '0' + hours : hours;
            minutesEl.innerText = minutes < 10 ? '0' + minutes : minutes;
            secondsEl.innerText = seconds < 10 ? '0' + seconds : seconds;
        }

        const interval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>

</html>
